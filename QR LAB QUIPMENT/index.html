
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LabTrack | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">QR</div>
                <h1>LabTrack</h1>
            </div>

            <!-- Login Section -->
            <div id="loginSection">

                <div class="login-heading">
                    <h2>Welcome Back!</h2>
                    <p>Login to access your LabTrack account.</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        
<div class="form-group">
    <label for="loginRole">Select Your Role</label>

    <select id="loginRole" required>
        <option value="">Choose your role</option>
        <option value="admin">Admin</option>
        <option value="student">Student</option>
    </select>
</div>

                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" id="loginBtn">

                        Login
                    </button>

                    <p id="message"></p>
                    <p class="auth-switch">
    <a href="#" id="forgotPassword">Forgot Password?</a>
</p>

                </form>

                <p class="auth-switch">
                    New student?
                    <a href="#" id="showSignup">Create an account</a>
                </p>

            </div>

            <!-- Student Signup Section -->
            <div id="signupSection" style="display: none;">

                <div class="login-heading">
                    <h2>Student Sign Up</h2>
                    <p>Create your LabTrack student account.</p>
                </div>

                <form id="signupForm">

                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >
                    </div>

                    <button type="submit" id="signupBtn">
                        Create Student Account
                    </button>

                    <p id="signupMessage"></p>

                </form>

                <p class="auth-switch">
                    Already registered?
                    <a href="#" id="showLogin">Login here</a>
                </p>

            </div>

            <div class="login-footer">
                <p>QR-Based Lab Equipment Inventory System</p>
            </div>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
